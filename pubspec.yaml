name: dianoia
description: On-device LLM inference orchestrated in Dart, with native CPU kernels and Metal or Vulkan GPU kernels. Runs LFM3 for chat and tool calling.
version: 0.1.1
homepage: https://github.com/Atrac613/dianoia
repository: https://github.com/Atrac613/dianoia
issue_tracker: https://github.com/Atrac613/dianoia/issues
topics:
  - llm
  - inference
  - ffi
  - metal
  - vulkan

environment:
  sdk: ^3.10.0

executables:
  dianoia:
dependencies:
  # The oldest that work cover apps whose other build hooks still need
  # code_assets 1.x (dart_ping 10, say).
  code_assets: '>=1.2.1 <3.0.0'
  crypto: ^3.0.8
  hooks: ^2.0.2
  logging: ^1.3.0
  native_toolchain_c: '>=0.19.1 <0.20.0'
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# Checks on Linux: there are no native kernels for linux-x64, so the engine
# runs in Dart alone here and the GPU and model tests skip themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      # The Flutter apps (example, tool/device_bench) are analyzed by the
      # flutter job, with their own packages resolved.
      - run: dart analyze --fatal-infos lib bin hook test
      - run: dart test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: tool/device_bench
        working-directory: tool/device_bench
        run: |
          flutter pub get
          flutter analyze --fatal-infos
